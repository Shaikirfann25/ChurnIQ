[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: fast, isolated unit tests (no I/O)
    integration: tests that read saved project artifacts
    slow: tests that load Keras / SHAP artifacts (heavy)
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning

